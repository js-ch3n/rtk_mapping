common:
    lid_topic:  "/velodyne_points_a"
    imu_topic:  "/imu_raw_a"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2                # Velodyne
    scan_line: 32
    scan_rate: 10
    timestamp_unit: 2            # microsecond
    blind: 2

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     100.0
    extrinsic_est_en:  false
    extrinsic_T: [ 0, 0, 0.28]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

rtk:
    rtk_mode_en: true
    rtk_topic: "/rtk_odom"
    rtk_fuse_en: false      # true=RTK参与IEKF残差融合, false=RTK直接覆盖定位(legacy)
    rtk_repeat_n: 5         # RTK信任度:重复行数N=R_lidar/R_rtk (>1=更信RTK, 1=等权)

publish:
    path_en:  true
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: -1
